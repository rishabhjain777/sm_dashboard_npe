<!-- ══════════════════ TAB 6: AI Improvement To-Dos ══════════════════ -->
<div id="tabContent-todos" class="tab-content">

    <div style="margin-top: 10px;">

        <!-- ══════════════════ DEDICATED AI IMPROVEMENT TO-DO LIST ══════════════════ -->
        <div id="aiTodosSection" style="background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 20px 22px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);">
            
            <!-- To-Do Header & Live Progress -->
            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px;">
                <div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span style="background: #dbeafe; color: #1e40af; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 4px; text-transform: uppercase;">
                            ENGINEERING ROADMAP
                        </span>
                        <span style="font-size: 18px; font-weight: 800; color: #0f172a;">
                            🚀 AI Improvement To-Do List
                        </span>
                    </div>
                    <div style="font-size: 12.5px; color: #64748b; margin-top: 4px;">
                        Actionable engineering improvements generated by Gemini AI across daily retrospectives to optimize selection, execution, and risk management.
                    </div>
                </div>
                
                <!-- Live Progress Card -->
                <div style="background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 18px; min-width: 220px; text-align: right;">
                    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
                        <span style="font-size: 11.5px; font-weight: 700; color: #64748b; text-transform: uppercase;">Implementation:</span>
                        <span style="font-size: 13.5px; font-weight: 800; color: #0f172a;">
                            <span id="todoCompletedCount">0</span> of <span id="todoTotalCount">0</span> Done (<span id="todoPercentText">0%</span>)
                        </span>
                    </div>
                    <div style="width: 100%; height: 7px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin-top: 6px;">
                        <div id="todoProgressBar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #10b981, #059669); border-radius: 999px; transition: width 0.3s ease;"></div>
                    </div>
                </div>
            </div>

            <!-- Filters & Actions Bar -->
            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 14px; margin-bottom: 16px;">
                <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                    <button class="todo-filter-btn" id="filterBtn-all" onclick="setTodoFilter('all')" style="padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; border: 1px solid #0f172a; background: #0f172a; color: #ffffff; cursor: pointer;">
                        All (<span id="filterCountAll">0</span>)
                    </button>
                    <button class="todo-filter-btn" id="filterBtn-pending" onclick="setTodoFilter('pending')" style="padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; border: 1px solid #cbd5e1; background: #ffffff; color: #475569; cursor: pointer;">
                        ⏳ Pending (<span id="filterCountPending">0</span>)
                    </button>
                    <button class="todo-filter-btn" id="filterBtn-completed" onclick="setTodoFilter('completed')" style="padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; border: 1px solid #cbd5e1; background: #ffffff; color: #475569; cursor: pointer;">
                        ✅ Completed (<span id="filterCountCompleted">0</span>)
                    </button>
                </div>

                <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                    <select id="todoCatFilter" onchange="applyTodoCardFilters()" style="padding: 5px 10px; font-size: 12px; font-weight: 600; border: 1px solid #cbd5e1; border-radius: 6px; background: #f8fafc; color: #0f172a; cursor: pointer;">
                        <option value="ALL">All Categories</option>
                        <option value="Risk Management">Risk Management</option>
                        <option value="Execution Engine">Execution Engine</option>
                        <option value="Alpha Model">Alpha Model</option>
                        <option value="Model Calibration">Model Calibration</option>
                        <option value="General">General</option>
                    </select>

                    <button onclick="toggleCustomTodoForm()" style="padding: 5px 12px; font-size: 12px; font-weight: 700; border: 1px solid #38bdf8; background: #e0f2fe; color: #0369a1; border-radius: 6px; cursor: pointer;">
                        + Add Custom Task
                    </button>
                </div>
            </div>

            <!-- Custom Task Input Form (Collapsible) -->
            <div id="customTodoForm" style="display: none; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 14px 16px; margin-bottom: 16px;">
                <div style="font-size: 13px; font-weight: 700; color: #0f172a; margin-bottom: 8px;">➕ Add Custom Improvement Item</div>
                <div style="display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 8px; align-items: center;">
                    <input type="text" id="customTodoTitle" placeholder="Task Title / Enhancement description" style="padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12.5px;">
                    <select id="customTodoCat" style="padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; background: #ffffff;">
                        <option value="Risk Management">Risk Management</option>
                        <option value="Execution Engine">Execution Engine</option>
                        <option value="Alpha Model">Alpha Model</option>
                        <option value="Model Calibration">Model Calibration</option>
                        <option value="General">General</option>
                    </select>
                    <select id="customTodoPri" style="padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; background: #ffffff;">
                        <option value="HIGH">HIGH Priority</option>
                        <option value="MEDIUM">MEDIUM Priority</option>
                        <option value="LOW">LOW Priority</option>
                    </select>
                    <button onclick="submitCustomTodo()" style="padding: 6px 14px; background: #16a34a; color: #ffffff; border: none; border-radius: 6px; font-weight: 700; font-size: 12px; cursor: pointer;">
                        Save Task
                    </button>
                </div>
            </div>

            <!-- Master Cards Container -->
            <div id="masterTodosList">
                
            </div>

        </div><!-- /#aiTodosSection -->

    </div>

    <script>
    const TODO_STORAGE_KEY = "fno_retrospective_todos_state_v1";
    const CUSTOM_TODO_KEY = "fno_custom_todos_v1";
    let currentStatusFilter = "all";

    function getSavedTodoState() {
        try {
            return JSON.parse(localStorage.getItem(TODO_STORAGE_KEY) || "{}");
        } catch(e) {
            return {};
        }
    }

    function saveTodoState(state) {
        try {
            localStorage.setItem(TODO_STORAGE_KEY, JSON.stringify(state));
        } catch(e) {}
    }

    function toggleTodo(todoId, isChecked) {
        const state = getSavedTodoState();
        state[todoId] = isChecked;
        saveTodoState(state);
        syncTodoVisuals(todoId, isChecked);
        recalcTodoProgress();
    }

    function syncTodoVisuals(todoId, isChecked) {
        ["master", "panel"].forEach(prefix => {
            const card = document.getElementById("todoCard-" + prefix + "-" + todoId);
            const chk = document.getElementById("chk-" + prefix + "-" + todoId);
            const title = document.getElementById("todoTitle-" + prefix + "-" + todoId);
            const badge = document.getElementById("todoBadge-" + prefix + "-" + todoId);

            if (chk) chk.checked = isChecked;
            if (card) {
                card.setAttribute("data-completed", isChecked ? "true" : "false");
                if (isChecked) {
                    card.style.background = "#f0fdf4";
                    card.style.borderColor = "#86efac";
                } else {
                    card.style.background = "#ffffff";
                    card.style.borderColor = "#e2e8f0";
                }
            }
            if (title) {
                title.style.textDecoration = isChecked ? "line-through" : "none";
                title.style.color = isChecked ? "#15803d" : "#0f172a";
            }
            if (badge) {
                if (isChecked) {
                    badge.innerHTML = "✅ Done";
                    badge.style.background = "#dcfce7";
                    badge.style.color = "#15803d";
                } else {
                    badge.innerHTML = "⏳ Pending";
                    badge.style.background = "#f1f5f9";
                    badge.style.color = "#64748b";
                }
            }
        });
    }

    function recalcTodoProgress() {
        const masterCards = document.querySelectorAll(".todo-master-card");
        let total = masterCards.length;
        let completed = 0;

        masterCards.forEach(c => {
            if (c.getAttribute("data-completed") === "true") {
                completed++;
            }
        });

        let pending = total - completed;
        let pct = total > 0 ? Math.round((completed / total) * 100) : 0;

        const elTot = document.getElementById("todoTotalCount");
        const elDone = document.getElementById("todoCompletedCount");
        const elPct = document.getElementById("todoPercentText");
        const elBar = document.getElementById("todoProgressBar");
        const elCntAll = document.getElementById("filterCountAll");
        const elCntPend = document.getElementById("filterCountPending");
        const elCntDone = document.getElementById("filterCountCompleted");
        const elHdrCount = document.getElementById("btnTodoHeaderCount");
        const elNavBadge = document.getElementById("nav-todos-badge");

        if (elTot) elTot.innerText = total;
        if (elDone) elDone.innerText = completed;
        if (elPct) elPct.innerText = pct + "%";
        if (elBar) elBar.style.width = pct + "%";
        if (elCntAll) elCntAll.innerText = total;
        if (elCntPend) elCntPend.innerText = pending;
        if (elCntDone) elCntDone.innerText = completed;
        if (elHdrCount) elHdrCount.innerText = total;
        if (elNavBadge) elNavBadge.innerText = pending;

        applyTodoCardFilters();
    }

    function setTodoFilter(status) {
        currentStatusFilter = status;
        ["all", "pending", "completed"].forEach(s => {
            const btn = document.getElementById("filterBtn-" + s);
            if (btn) {
                if (s === status) {
                    btn.style.background = "#0f172a";
                    btn.style.color = "#ffffff";
                    btn.style.borderColor = "#0f172a";
                } else {
                    btn.style.background = "#ffffff";
                    btn.style.color = "#475569";
                    btn.style.borderColor = "#cbd5e1";
                }
            }
        });
        applyTodoCardFilters();
    }

    function applyTodoCardFilters() {
        const catFilter = document.getElementById("todoCatFilter") ? document.getElementById("todoCatFilter").value : "ALL";
        const masterCards = document.querySelectorAll(".todo-master-card");

        masterCards.forEach(card => {
            const isCompleted = card.getAttribute("data-completed") === "true";
            const cardCat = card.getAttribute("data-category") || "";

            let matchesStatus = true;
            if (currentStatusFilter === "pending") matchesStatus = !isCompleted;
            if (currentStatusFilter === "completed") matchesStatus = isCompleted;

            let matchesCat = true;
            if (catFilter !== "ALL") matchesCat = (cardCat === catFilter);

            card.style.display = (matchesStatus && matchesCat) ? "flex" : "none";
        });
    }

    function toggleCustomTodoForm() {
        const f = document.getElementById("customTodoForm");
        if (f) {
            f.style.display = (f.style.display === "none") ? "block" : "none";
        }
    }

    function submitCustomTodo() {
        const titleEl = document.getElementById("customTodoTitle");
        const catEl = document.getElementById("customTodoCat");
        const priEl = document.getElementById("customTodoPri");

        if (!titleEl || !titleEl.value.trim()) return;

        const newId = "custom-" + Date.now();
        const customObj = {
            id: newId,
            title: titleEl.value.trim(),
            category: catEl.value,
            priority: priEl.value,
            date: "User Custom",
            description: "Custom user-defined algorithmic enhancement."
        };

        try {
            const existing = JSON.parse(localStorage.getItem(CUSTOM_TODO_KEY) || "[]");
            existing.push(customObj);
            localStorage.setItem(CUSTOM_TODO_KEY, JSON.stringify(existing));
        } catch(e) {}

        renderSingleCustomCard(customObj);
        titleEl.value = "";
        toggleCustomTodoForm();
        recalcTodoProgress();
    }

    function renderSingleCustomCard(it) {
        const pri = it.priority || "HIGH";
        const pri_bg = pri === "HIGH" ? "#fee2e2" : (pri === "MEDIUM" ? "#fef3c7" : "#e0f2fe");
        const pri_col = pri === "HIGH" ? "#b91c1c" : (pri === "MEDIUM" ? "#b45309" : "#0369a1");
        const it_id = it.id;

        const card = document.createElement("div");
        card.className = "todo-master-card";
        card.id = "todoCard-master-" + it_id;
        card.setAttribute("data-id", it_id);
        card.setAttribute("data-priority", pri);
        card.setAttribute("data-category", it.category);
        card.setAttribute("data-date", it.date);
        card.setAttribute("data-completed", "false");
        card.style = "background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); transition: all 0.2s;";
        
        card.innerHTML = `
            <input type="checkbox" class="master-todo-chk" id="chk-master-${it_id}" onchange="toggleTodo('${it_id}', this.checked)" style="width: 20px; height: 20px; cursor: pointer; accent-color: #16a34a; margin-top: 3px; flex-shrink: 0;">
            <div style="flex: 1;">
                <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                    <span style="background: ${pri_bg}; color: ${pri_col}; font-weight: 700; font-size: 11px; padding: 2px 7px; border-radius: 4px;">${pri} PRIORITY</span>
                    <span style="background: #f1f5f9; color: #475569; font-weight: 600; font-size: 11.5px; padding: 2px 8px; border-radius: 4px;">${it.category}</span>
                    <span style="background: #e2e8f0; color: #334155; font-size: 11px; padding: 2px 7px; border-radius: 4px;">👤 Custom</span>
                    <span class="todo-status-badge" id="todoBadge-master-${it_id}" style="margin-left: auto; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 4px; background: #f1f5f9; color: #64748b;">⏳ Pending</span>
                </div>
                <div class="todo-title" id="todoTitle-master-${it_id}" style="font-size: 14.5px; font-weight: 700; color: #0f172a; margin-top: 6px;">${it.title}</div>
                <div style="font-size: 13px; color: #475569; margin-top: 4px; line-height: 1.5;">${it.description}</div>
            </div>
        `;
        const list = document.getElementById("masterTodosList");
        if (list) list.prepend(card);
    }

    (function initTodosTab() {
        try {
            const customs = JSON.parse(localStorage.getItem(CUSTOM_TODO_KEY) || "[]");
            customs.forEach(c => renderSingleCustomCard(c));

            const savedState = getSavedTodoState();
            // Seed savedState from any server pre-completed cards
            document.querySelectorAll(".todo-master-card, .todo-item-card").forEach(c => {
                const cid = c.getAttribute("data-id");
                if (cid && savedState[cid] === undefined && c.getAttribute("data-completed") === "true") {
                    savedState[cid] = true;
                }
            });
            saveTodoState(savedState);

            Object.keys(savedState).forEach(id => {
                if (savedState[id]) {
                    syncTodoVisuals(id, true);
                }
            });

            recalcTodoProgress();
        } catch(e) {}
    })();
    </script>
